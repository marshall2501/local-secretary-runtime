name: Vue UI and isolated Task API checks
on:
  push:
    branches: [main]
    paths:
      - "interfaces/vue_lab/**"
      - "interfaces/vue_daily/**"
      - "interfaces/api/ritsuko_tasks.py"
      - "interfaces/api/pkb_read.py"
      - "interfaces/api/secretary_server.py"
      - "interfaces/api/pkb_commands.py"
      - "interfaces/api/external_read.py"
      - "interfaces/api/finance.py"
      - "interfaces/api/daily_overview.py"
      - "infrastructure/schema_diagram/**"
      - "application/schema_diagram.py"
      - "tests/test_secretary_er_diagram.py"
      - "interfaces/api/magi_settings.py"
      - "tests/test_secretary_capability_views.py"
      - "interfaces/vue_daily/frontend/src/features/finance/**"
      - "interfaces/vue_daily/frontend/src/features/system/**"
      - "tests/test_secretary_external_read.py"
      - "tests/test_secretary_pkb_commands.py"
      - "infrastructure/secretary_logging.py"
      - "bootstrap/secretary_server.py"
      - "tests/test_secretary_server.py"
      - "bootstrap/web_runtime.py"
      - "tests/test_vue_pkb_read.py"
      - "tests/test_vue_server_logging.py"
      - "tests/test_ritsuko_shared_http_router.py"
      - "bootstrap/ritsuko_task_composition.py"
      - "bootstrap/magi_task_runtime.py"
      - "ritsuko/application/source_execution.py"
      - "ritsuko/application/pkb_observation.py"
      - "tests/test_magi_task_runtime_composition.py"
      - "tests/test_magi_shared_source.py"
      - "tests/test_magi_runtime_readonly_probe.py"
      - "scripts/db/probe_magi_runtime_readonly.py"
      - "ritsuko/application/task_runtime.py"
      - "ritsuko/application/task_commands.py"
      - "ritsuko/core/observation_loop.py"
      - "tests/test_vue_lab.py"
      - "tests/test_task_composition.py"
      - "tests/test_vue_daily_api.py"
      - "tests/test_vue_task_commands.py"
      - ".github/workflows/vue-secretary-ui-lab.yml"
  pull_request:
    paths:
      - "interfaces/vue_lab/**"
      - "interfaces/vue_daily/**"
      - "interfaces/api/ritsuko_tasks.py"
      - "interfaces/api/pkb_read.py"
      - "interfaces/api/secretary_server.py"
      - "interfaces/api/pkb_commands.py"
      - "interfaces/api/external_read.py"
      - "interfaces/api/finance.py"
      - "interfaces/api/daily_overview.py"
      - "infrastructure/schema_diagram/**"
      - "application/schema_diagram.py"
      - "tests/test_secretary_er_diagram.py"
      - "interfaces/api/magi_settings.py"
      - "tests/test_secretary_capability_views.py"
      - "interfaces/vue_daily/frontend/src/features/finance/**"
      - "interfaces/vue_daily/frontend/src/features/system/**"
      - "tests/test_secretary_external_read.py"
      - "tests/test_secretary_pkb_commands.py"
      - "infrastructure/secretary_logging.py"
      - "bootstrap/secretary_server.py"
      - "tests/test_secretary_server.py"
      - "bootstrap/web_runtime.py"
      - "tests/test_vue_pkb_read.py"
      - "tests/test_vue_server_logging.py"
      - "tests/test_ritsuko_shared_http_router.py"
      - "bootstrap/ritsuko_task_composition.py"
      - "bootstrap/magi_task_runtime.py"
      - "ritsuko/application/source_execution.py"
      - "ritsuko/application/pkb_observation.py"
      - "tests/test_magi_task_runtime_composition.py"
      - "tests/test_magi_shared_source.py"
      - "tests/test_magi_runtime_readonly_probe.py"
      - "scripts/db/probe_magi_runtime_readonly.py"
      - "ritsuko/application/task_runtime.py"
      - "ritsuko/application/task_commands.py"
      - "ritsuko/core/observation_loop.py"
      - "tests/test_vue_lab.py"
      - "tests/test_task_composition.py"
      - "tests/test_vue_daily_api.py"
      - "tests/test_vue_task_commands.py"
      - ".github/workflows/vue-secretary-ui-lab.yml"
  workflow_dispatch:
# 架空Taskと保存済みTaskのfake Query契約を試験する。運用DB・実LLMは使わない。
jobs:
  isolated-api-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Python dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Python static validation
        run: python -m compileall -q bootstrap/secretary_server.py infrastructure/secretary_logging.py interfaces/api/secretary_server.py interfaces/api/pkb_commands.py interfaces/api/external_read.py interfaces/api/finance.py interfaces/api/daily_overview.py interfaces/api/magi_settings.py tests/test_secretary_capability_views.py infrastructure/schema_diagram/svg_renderer.py tests/test_secretary_er_diagram.py tests/test_secretary_server.py tests/test_secretary_pkb_commands.py tests/test_secretary_external_read.py tests/test_vue_server_logging.py interfaces/api/ritsuko_tasks.py interfaces/api/pkb_read.py tests/test_ritsuko_shared_http_router.py interfaces/vue_lab interfaces/vue_daily bootstrap/ritsuko_task_composition.py tests/test_vue_lab.py tests/test_task_composition.py tests/test_vue_daily_api.py tests/test_vue_task_commands.py tests/test_magi_task_runtime_composition.py tests/test_magi_shared_source.py tests/test_magi_runtime_readonly_probe.py scripts/db/probe_magi_runtime_readonly.py bootstrap/magi_task_runtime.py ritsuko/application/source_execution.py ritsuko/application/pkb_observation.py
      - name: One-origin Secretary Server, Task/PKB and product log (no DB)
        run: python -m unittest discover -s tests -p test_secretary_server.py -v
      - name: Independent PKB write and Pending API on unified host
        run: python -m unittest discover -s tests -p test_secretary_pkb_commands.py -v
      - name: Legacy 8010 external read clients use unified application
        run: python -m unittest discover -s tests -p test_secretary_external_read.py -v
      - name: Finance, Billing, Connections and Debug API on one Host
        run: python -m unittest discover -s tests -p test_secretary_capability_views.py -v
      - name: Read-only ER diagram offline SVG, Mermaid and FastAPI contract
        run: python -m unittest discover -s tests -p test_secretary_er_diagram.py -v
      - name: Synthetic shared-RITSUKO API acceptance
        run: python -m unittest discover -s tests -p test_vue_lab.py -v
      - name: Shared Task composition acceptance
        run: python -m unittest discover -s tests -p test_task_composition.py -v
      - name: Shared Task HTTP router independently of Vue (fake ports)
        run: python -m unittest discover -s tests -p test_ritsuko_shared_http_router.py -v
      - name: Persisted Task read-only API contract (injected, no DB)
        run: python -m unittest discover -s tests -p test_vue_daily_api.py -v
      - name: PKB SQL-first read contract (fake repository)
        run: python -m unittest discover -s tests -p test_vue_pkb_read.py -v
      - name: Vue Uvicorn timestamped startup and access logs
        run: python -m unittest discover -s tests -p test_vue_server_logging.py -v
      - name: Task command job lifecycle and stop contract
        run: python -m unittest discover -s tests -p test_vue_task_commands.py -v
      - name: Shared MAGI Task policy and Repository composition (fake DB)
        run: python -m unittest discover -s tests -p test_magi_task_runtime_composition.py -v
      - name: Shared PKB Web Finance Source scope (no DB/provider)
        run: python -m unittest discover -s tests -p test_magi_shared_source.py -v
      - name: MAGI read-only probe validation (no DB)
        run: python -m unittest discover -s tests -p test_magi_runtime_readonly_probe.py -v
      - name: Type check and build Vue
        working-directory: interfaces/vue_lab/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Type check and build Vue daily UI
        working-directory: interfaces/vue_daily/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Check generated frontend files
        run: |
          test -f interfaces/vue_lab/frontend/dist/index.html
          test -f interfaces/vue_daily/frontend/dist/index.html
      # CI runnerの隔離FastAPIとfake TaskだけをChromiumで操作する。
      # ローカルDB・実LLM・Secret・任意本番サービスへの接続はしない。
      - name: Install Chromium for isolated daily Vue browser regression
        working-directory: interfaces/vue_daily/frontend
        run: npx playwright install --with-deps chromium
      - name: Real Chromium navigation and synthetic Task lifecycle
        working-directory: interfaces/vue_daily/frontend
        run: npm run test:browser
