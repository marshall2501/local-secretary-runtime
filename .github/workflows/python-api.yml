name: Python API static checks
on:
  pull_request:
    paths:
      - "api/**"
      - "scripts/memory/**"
      - "tests/test_api_static.py"
      - "tests/test_memory_review.py"
      - "tests/test_memory_search.py"
      - ".github/workflows/python-api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/memory/**"
      - "tests/test_api_static.py"
      - "tests/test_memory_review.py"
      - "tests/test_memory_search.py"
      - ".github/workflows/python-api.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements.txt
      - run: python -m compileall -q api scripts/memory tests/test_api_static.py tests/test_memory_review.py tests/test_memory_search.py
      - run: python -m unittest discover -s tests -p test_api_static.py -v
      - run: python -m unittest discover -s tests -p test_memory_review.py -v
      - run: python -m unittest discover -s tests -p test_memory_search.py -v
