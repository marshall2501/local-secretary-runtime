name: PKB Web Workbench isolated tests
on:
  push:
    branches: [main]
    paths:
      - "interfaces/web/**"
      - "ritsuko/**"
      - "pkb/**"
      - "capabilities/**"
      - "integrations/**"
      - "infrastructure/**"
      - "bootstrap/**"
      - "interfaces/workbench/**"
      - "scripts/ui/**"
      - "scripts/db/**"
      - "config/**"
      - "db/isolated/pkb_proto/**"
      - "scripts/pkb/isolated/run_pending_setup.ps1"
      - "scripts/pkb/isolated/verify_finance_versioning.ps1"
      - "tests/test_*.py"
      - "tests/db/**"
      - "requirements-web.txt"
      - ".github/workflows/pkb-web-workbench.yml"
  pull_request:
    paths:
      - "interfaces/web/**"
      - "ritsuko/**"
      - "pkb/**"
      - "capabilities/**"
      - "integrations/**"
      - "infrastructure/**"
      - "bootstrap/**"
      - "interfaces/workbench/**"
      - "scripts/ui/**"
      - "scripts/db/**"
      - "config/**"
      - "db/isolated/pkb_proto/**"
      - "scripts/pkb/isolated/run_pending_setup.ps1"
      - "scripts/pkb/isolated/verify_finance_versioning.ps1"
      - "tests/test_*.py"
      - "tests/db/**"
      - "requirements-web.txt"
      - ".github/workflows/pkb-web-workbench.yml"
  workflow_dispatch:
jobs:
  offline-and-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LSA_WORKBENCH_DB: /tmp/secretary-workbench-ci/runs.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-web.txt
      - run: python -m compileall -q bootstrap config ritsuko pkb capabilities integrations infrastructure interfaces/web interfaces/workbench scripts/db/run_production_runtime_rehearsal.py scripts/db/verify_production_runtime.py tests/test_pkb_web_workbench.py tests/test_pkb_daily.py tests/test_core_ooda.py tests/test_core_advisor.py tests/test_background_jobs.py tests/test_core_coordinator.py tests/test_core_synthesis.py tests/test_ritsuko_magi_protocol.py tests/test_magi_settings.py tests/test_async_transport.py tests/test_web_research.py tests/test_finance_preview.py tests/test_finance_import.py tests/test_production_runtime_rehearsal.py tests/test_runtime_web.py tests/test_production_runtime_verifier.py
      - name: Validate repository PowerShell and static rules
        shell: pwsh
        run: ./tests/db/test-static.ps1
      - run: python -m unittest discover -s tests -p test_architecture_boundaries.py -v
      - run: python -m unittest discover -s tests -p test_pkb_web_workbench.py -v
      - run: python -m unittest discover -s tests -p test_pkb_daily.py -v
      - run: python -m unittest discover -s tests -p test_core_gui.py -v
      - run: python -m unittest discover -s tests -p test_core_ooda.py -v
      - run: python -m unittest discover -s tests -p test_core_advisor.py -v
      - run: python -m unittest discover -s tests -p test_background_jobs.py -v
      - run: python -m unittest discover -s tests -p test_core_coordinator.py -v
      - run: python -m unittest discover -s tests -p test_core_synthesis.py -v
      - run: python -m unittest discover -s tests -p test_ritsuko_magi_protocol.py -v
      - run: python -m unittest discover -s tests -p test_magi_settings.py -v
      - run: python -m unittest discover -s tests -p test_async_transport.py -v
      - run: python -m unittest discover -s tests -p test_web_research.py -v
      - run: python -m unittest discover -s tests -p test_finance_preview.py -v
      - run: python -m unittest discover -s tests -p test_finance_import.py -v
      - run: python -m unittest discover -s tests -p test_production_runtime_rehearsal.py -v
      - run: python -m unittest discover -s tests -p test_runtime_web.py -v
      - run: python -m unittest discover -s tests -p test_production_runtime_verifier.py -v
      - run: python -m unittest discover -s tests -p test_pkb_ingestion_gate.py -v
      - run: python -m unittest discover -s tests -p test_pkb_write_slice.py -v
      - run: python -m unittest discover -s tests -p test_pkb_diagnostic_cases.py -v
      - name: Start isolated localhost server and inspect read-only fixture API
        shell: bash
        run: |
          python -m interfaces.workbench.app >/tmp/workbench.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..20}; do
            if curl --silent --show-error --fail http://127.0.0.1:8092/api/workbench/episodes -o /tmp/episodes.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/workbench.log
            exit 1
          fi
          python -c "import json; d=json.load(open('/tmp/episodes.json')); assert len(d)==10; assert all('id' in e and 'text' in e for e in d)"
          if ! curl --silent --show-error --fail http://127.0.0.1:8092/ -o /tmp/workbench.html; then
            cat /tmp/workbench.log
            exit 1
          fi
          if ! grep -q "Local Secretary" /tmp/workbench.html; then
            cat /tmp/workbench.log
            exit 1
          fi
          curl --silent --show-error --fail http://127.0.0.1:8092/api/workbench/runs -o /tmp/runs.json
          python -c "import json; assert json.load(open('/tmp/runs.json')) == []"

