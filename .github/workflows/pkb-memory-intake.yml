name: Memory Intake isolated PostgreSQL
on:
  push:
    branches: [main]
    paths: ['pkb/**', 'ritsuko/**', 'infrastructure/**', 'interfaces/web/**', 'pkb_proto/sql/**', 'pkb_proto/run_pending_setup.ps1', 'tests/test_memory_intake*.py', 'tests/test_pkb_corrections.py', 'tests/test_pkb_query.py', '.github/workflows/pkb-memory-intake.yml']
  pull_request:
    paths: ['pkb_proto/**', 'tests/test_memory_intake*.py', '.github/workflows/pkb-memory-intake.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: secretary_pkb_proto_20260927
          POSTGRES_PASSWORD: fictional-ci-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PKB_MEMORY_INTEGRATION: '1'
      PKB_TEST_PASSWORD: fictional-ci-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt
      - run: python -m unittest discover -s tests -p 'test_memory_intake*.py' -v
      - run: python -m unittest discover -s tests -p test_pkb_corrections.py -v
      - run: python -m unittest discover -s tests -p test_pkb_query.py -v
