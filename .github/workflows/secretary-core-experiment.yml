name: Secretary Core experimental tests

on:
  push:
    branches:
      - experiment/orchestrator-framework-comparison
    paths:
      - 'scripts/secretary/secretary_core.py'
      - 'scripts/secretary/framework_compare/shared.py'
      - 'tests/test_secretary_core.py'
      - 'scripts/secretary/secretary_gui.py'
      - 'scripts/secretary/secretary_gui_model.py'
      - 'tests/test_secretary_gui_model.py'
      - '.github/workflows/secretary-core-experiment.yml'
  workflow_dispatch:

jobs:
  secretary-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install orchestration runtime
        run: python -m pip install 'langgraph==1.2.12' 'langchain==1.4.2' 'langchain-ollama==1.1.0' 'nicegui==3.17.1'
      - name: Validate Python syntax
        run: python -m py_compile scripts/secretary/secretary_core.py scripts/secretary/secretary_gui.py scripts/secretary/secretary_gui_model.py tests/test_secretary_core.py tests/test_secretary_gui_model.py
      - name: Run deterministic Secretary Core tests
        run: python -m unittest discover -s tests -p 'test_secretary*.py' -v
      - name: Import NiceGUI page without starting a network listener
        run: python -c "import sys; sys.path.insert(0, 'scripts/secretary'); import secretary_gui; print('Secretary GUI import OK')"
