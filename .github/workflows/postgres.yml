name: PostgreSQL foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify Git exclusions (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/db/test-static.ps1
  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<4" "httpx>=0.27,<1" "anyio>=4,<5"
      - name: Prepare ephemeral test credentials
        shell: pwsh
        run: ./scripts/db/postgres.ps1 -Action Setup
      - name: Validate scripts
        shell: pwsh
        run: ./tests/db/test-static.ps1
      - name: Verify PKB Goal write target identity and Source guard
        run: |
          python -m unittest discover -s tests -p test_observation_sources.py -v
          python -m unittest discover -s tests -p test_goal_pkb_write_loop.py -v
          python -m unittest discover -s tests -p test_pkb_structured_claim.py -v
          python -m unittest discover -s tests -p test_pkb_claim_operation.py -v
          python -m unittest discover -s tests -p test_goal_contract.py -v
          python -m unittest discover -s tests -p test_probe_magi_pkb_goal_synthetic.py -v
      - name: Test isolated PostgreSQL lifecycle
        shell: pwsh
        run: ./tests/db/test-integration.ps1
